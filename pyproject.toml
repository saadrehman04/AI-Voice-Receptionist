# Root of the uv workspace. It is "virtual": it holds no code itself, only the
# list of member packages and the tool config they all share.

[tool.uv.workspace]
members = ["packages/shared", "apps/agent", "apps/api", "evals"]

[tool.uv.sources]
receptionist-shared = { workspace = true }

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "httpx>=0.28.1",
    "ruff>=0.17.4",
]

[tool.uv]
default-groups = ["dev"]

# ---------- ruff (lint + format) ----------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/shared/src", "apps/agent/src", "apps/api/src", "evals/src"]
extend-exclude = ["apps/web"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "B",        # bugbear (likely bugs)
    "UP",       # modern Python syntax
    "ASYNC",    # async pitfalls (blocking calls in async code)
    "S",        # bandit security checks
    "SIM",      # simplifications
    "RUF",      # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]  # assert is fine in tests

# ---------- mypy ----------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = ["packages/shared/src", "apps/agent/src", "apps/api/src", "evals/src"]
explicit_package_bases = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------- pytest ----------
[tool.pytest.ini_options]
testpaths = ["packages/shared/tests", "apps/agent/tests", "apps/api/tests", "evals/tests"]
addopts = ["--import-mode=importlib", "-ra", "--strict-markers"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
