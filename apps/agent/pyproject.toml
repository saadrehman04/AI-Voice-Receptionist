[project]
name = "receptionist-agent"
version = "0.1.0"
description = "Pipecat voice agent: VAD -> STT -> LLM -> TTS (pipeline arrives in Phase 1)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "httpx2>=2.16.0",
    "pipecat-ai[google,groq,kokoro,ollama,piper,runner,silero,webrtc,whisper]==1.15.0",
    "receptionist-shared",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"
