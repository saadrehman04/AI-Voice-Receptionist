name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Real Postgres + Redis: the double-booking guarantees live there, so CI must test them.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: receptionist
          POSTGRES_PASSWORD: receptionist
          POSTGRES_DB: receptionist
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U receptionist" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s
          --health-retries 10
    env:
      REQUIRE_SERVICES: "1"  # database tests must run, never skip, in CI
    steps:
      - uses: actions/checkout@v7

      # Python: uv reads .python-version (3.12) and installs it.
      # setup-uv publishes no floating major tag, so pin the exact release by commit SHA.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true

      # Web: Node from apps/web/.nvmrc, pnpm version from apps/web/package.json.
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/web/.nvmrc
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json
          cache: true
          cache_dependency_path: apps/web/pnpm-lock.yaml

      - name: Install
        run: |
          uv sync --all-packages --locked
          pnpm --dir apps/web install --frozen-lockfile

      - name: Lint
        run: make lint

      - name: Test
        run: make test
