policies:
  cancellation: Please cancel or reschedule at least 24 hours before your appointment. Missed appointments without notice may be charged 50 dollars.
  late_arrival: If you are more than 15 minutes late we may need to reschedule so other patients aren't kept waiting.
  payment: We accept credit and debit cards, Apple Pay, and HSA or FSA cards.

greeting:
  en: Thank you for calling Sunrise Dental Studio. This is our AI receptionist demo. How can I help you today?

handoff:
  name: Maria (front desk)
  phone: "+1 512 555 0100"

faq:
  - question: Do you take dental insurance?
    answer: Yes, we accept most PPO dental insurance plans, and we check your coverage before your visit. Please bring your insurance card.
    keywords: [insurance, ppo, coverage, plan, insured]
  - question: Do you see children?
    answer: Yes, we see children from age 3. Dr. Patel does our kids checkups.
    keywords: [children, kids, child, son, daughter, pediatric, age]
  - question: What should I do in a dental emergency?
    answer: For severe tooth pain, a broken tooth or swelling, book an emergency visit and we will see you the same day when a slot is free. For heavy bleeding or swelling that affects breathing, call 911.
    keywords: [emergency, pain, toothache, broken, swelling, urgent, bleeding]
  - question: Is there parking?
    answer: Yes, there is free parking behind the building, and the office is on the second floor with an elevator.
    keywords: [parking, park, car, elevator, wheelchair, access]
  - question: Do you offer payment plans?
    answer: Yes, for treatments over 500 dollars we offer interest-free payment plans over 6 months.
    keywords: [payment plan, installments, finance, monthly, afford]
  - question: What should I bring to my first visit?
    answer: Please bring a photo ID, your insurance card if you have one, and a list of any medicines you take. New patients should arrive 10 minutes early.
    keywords: [first visit, new patient, bring, documents, id, arrive]

booking_buffer_min: 10
min_notice_min: 120
max_days_ahead: 60
